services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: smartcity_postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: civic_admin
      POSTGRES_PASSWORD: civic_password
      POSTGRES_DB: smartcity_db
    ports:
      - "5434:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civic_admin -d smartcity_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: smartcity_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: smartcity_redis
    restart: unless-stopped
    ports:
      - "6380:6379"

volumes:
  postgis_data:
  qdrant_data:
